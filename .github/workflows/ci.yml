name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eleicoes
          POSTGRES_PASSWORD: eleicoes
          POSTGRES_DB: eleicoes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eleicoes" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://eleicoes:eleicoes@localhost:5432/eleicoes_test
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (demo election)
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eleicoes
          POSTGRES_PASSWORD: eleicoes
          POSTGRES_DB: eleicoes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eleicoes" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://eleicoes:eleicoes@localhost:5432/eleicoes
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @eleicoes/web exec playwright install --with-deps chromium
      - name: Start the demo stack
        run: |
          DEMO_OFFSET_MINUTES=10 DEMO_WAIT_SECONDS=0 node apps/worker/dist/demo/server.js &
          MIGRATIONS_DIR=packages/database/drizzle APP_MODE=DEVELOPMENT ELECTION_ROUND=demo-1 TSE_POLL_INTERVAL=3 TSE_REQUESTS_PER_SECOND=50 node apps/worker/dist/main.js &
          node apps/api/dist/main.js &
          npx serve@14 -l 3000 apps/web/out &
          npx wait-on -t 90000 http://localhost:3000 http://localhost:4000/api/health
          sleep 45
        env:
          DEMO_FIXTURE: ${{ github.workspace }}/fixtures/election-demo/election.json
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
