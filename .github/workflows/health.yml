# Watchdog: fails (GitHub emails the repository owner) when the site or the API is down.
# Between elections the site is an archive (no collector) and the API sleeps when idle on
# Railway, so this runs once a day: each check wakes the API and the database for a few minutes.
# Times are UTC: 12:17 = 9h17 Brasília. For the next election, bring back the frequent checks
# and the collector freshness test from git history (commit before "archive mode").
name: health

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API: https://api-production-39d40.up.railway.app
    steps:
      # The first request may wake the sleeping API and database: give it time.
      - name: API is up
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 "$API/api/health"
      - name: Site is up
        run: curl -fsS --retry 3 --retry-delay 10 -o /dev/null https://eleicoes.lucianookdp.dev/
